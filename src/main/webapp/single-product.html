<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Envy Clothings - Single Product</title>

    <link rel="stylesheet" href="assets/css/manage-product.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="icon" href="assets/images/logo/envy.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

<header class="site-header">
    <header-content></header-content>
</header>

<div class="product-detail">

    <div class="product-img">
        <div class="thumbnail-list">
            <img src="assets/images/products/defaultItem.png" id="thumb-image1">
            <img src="assets/images/products/defaultItem.png" id="thumb-image2">
            <img src="assets/images/products/defaultItem.png" id="thumb-image3">
        </div>
        <div class="main-img">
            <img src="assets/images/products/defaultItem.png" id="image1">
        </div>
    </div>

    <div class="product-info">
        <h2 class="title" id="title">Men Casual Round Neck T-Shirt</h2>
        <div class="rating">
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-half"></i>
            <span>(4.8)</span>
        </div>
        <span class="price" id="price">Rs 1000.00</span>
        <span style="color: #d40000; font-weight: bold" id="brand">Nike</span><br>
        <p id="desc">If your product descriptions read like a dry instruction manual,
            you’re missing a golden opportunity to connect with your audience and drive sales.</p>

        <div class="size-selection">
            <p> Size</p>
            <div class="size-options" id="size-options">
                <button data-size="S">S</button>
                <button data-size="M">M</button>
                <button data-size="L">L</button>
                <button data-size="XL">XL</button>
                <button data-size="XXL">XXL</button>
            </div>
        </div>

        <div class="color-selection">
            <span class="color-options" id="color-options"></span>
        </div>

        <small id="stock-info" style="color:#2e7d32; font-weight:600;"></small>
        <br>
        <br>
        <small id="stock" style="color:#2e7d32; font-weight:600;"></small>

        <div class="qty">
            <label for="qty-input">Quantity</label>
            <div class="qty-box">
                <button type="button" class="qty-btn" id="qty-minus">−</button>
                <input type="number"  id="qty-input"  min="1" value="1">
                <button type="button" class="qty-btn" id="qty-plus">+</button>
            </div>
        </div>


        <button class="btn" id="add-cart-btn">Add To Cart</button>
        <button class="btn" id="like-btn">Add To WishList</button>
        <div class="product-policy">
            <p>100% Original Material</p>
            <p>Easy return and exchange policy within 14 days</p>
        </div>

    </div>
</div>


<footer>
    <footer-content></footer-content>
</footer>

<script src="assets/js/header.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/single-product.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/wishList.js"></script>

<script>
    const qtyInput = document.getElementById("qty-input");
    const qtyPlus = document.getElementById("qty-plus");
    const qtyMinus = document.getElementById("qty-minus");

    qtyPlus.addEventListener("click", () => {
        qtyInput.value = parseInt(qtyInput.value) + 1;
    });

    qtyMinus.addEventListener("click", () => {
        if (parseInt(qtyInput.value) > 1) {
            qtyInput.value = parseInt(qtyInput.value) - 1;
        }
    });

    const mainImage = document.getElementById("image1");
    const thumbnails = document.querySelectorAll(".thumbnail-list img");

    thumbnails.forEach((thumb) => {
        thumb.addEventListener("click", () => {
            mainImage.src = thumb.src;
            thumbnails.forEach(img => img.classList.remove("active"));

            thumb.classList.add("active");
        });
    });

    const firstThumb = document.querySelector(".thumbnail-list img");
    if (firstThumb) {
        firstThumb.classList.add("active");
    }


</script>

</body>
</html>
