<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Envy Clothings - Advanced Search</title>

    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="icon" href="assets/images/logo/envy.png" type="image/x-icon">

    <link rel="icon" href="assets/images/logo/envy.png" type="image/x-icon">

    <style>

        .search-page {
            padding: 110px 9% 40px;
            display: flex;
            gap: 40px;
        }

        /* FILTER PANEL */
        .filter-panel {
            width: 260px;
        }

        .filter-panel h3 {
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .filter-group select,
        .filter-group input[type="range"] {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        .checkbox-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .price-range {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .filter-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #000;
            background: transparent;
            cursor: pointer;
        }

        /* SEARCH RESULTS */
        .search-results {
            flex: 1;
        }

        /* ================= ADVANCED SEARCH – UI ENHANCEMENTS ================= */

        body {
            background: #f7f7f7;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* MAIN LAYOUT */
        .search-page {
            padding: 120px 8% 50px;
            gap: 50px;
        }

        /* ================= FILTER PANEL ================= */
        .filter-panel {
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .filter-panel h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }

        /* FILTER GROUP */
        .filter-group {
            margin-bottom: 22px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #222;
        }

        /* SELECT & RANGE */
        .filter-group select,
        .filter-group input[type="range"] {
            width: 100%;
            padding: 9px 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .filter-group select:focus,
        .filter-group input[type="range"]:focus {
            border-color: #000;
            background: #fff;
        }

        /* CHECKBOX GROUP */
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #444;
        }

        .checkbox-group input {
            accent-color: #000;
        }

        /* PRICE RANGE */
        .price-range {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
        }

        /* APPLY BUTTON */
        .filter-panel button {
            width: 100%;
            padding: 11px;
            font-size: 14px;
            border-radius: 30px;
            border: 1px solid #000;
            background: #000;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-panel button:hover {
            background: transparent;
            color: #000;
        }

        /* ================= SEARCH RESULTS ================= */
        .search-results {
            background: transparent;
        }

        /* TOP BAR */
        .search-results > div:first-child {
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .search-results p {
            color: #444;
        }

        /* SORT SELECT */
        .search-results select {
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 13px;
            background: #fafafa;
        }

        /* ACCORDION FILTER SIDEBAR */

        .axil-shop-sidebar {
            padding: 25px;
        }

        .toggle-list {
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .toggle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 10px 0;
        }

        .toggle-header i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .toggle-content {
            list-style: none;
            padding: 10px 0 15px;
        }

        /* SMOOTH ACCORDION TRANSITION */

        .toggle-content {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-6px);
            transition: max-height 0.45s ease,
            opacity 0.3s ease,
            transform 0.3s ease;
        }

        .toggle-content li.chosen a {
            font-weight: 600;
            color: #000;
        }

        .toggle-content li.chosen::before {
            content: "✔";
            margin-right: 6px;
            font-size: 12px;
            color: #000;
        }


        /* OPEN STATE */
        .toggle-list.active .toggle-content {
            max-height: 500px; /* enough for content */
            opacity: 1;
            transform: translateY(0);
        }

        /* ICON ROTATION SMOOTH */
        .toggle-header i {
            transition: transform 0.35s ease;
        }

        .toggle-list:not(.active) .toggle-header i {
            transform: rotate(0deg);
        }

        .toggle-list.active .toggle-header i {
            transform: rotate(180deg);
        }

        .toggle-list.active .toggle-header i {
            transform: rotate(0deg);
        }

        .toggle-list:not(.active) .toggle-header i {
            transform: rotate(90deg);
        }

        .toggle-content li {
            margin-bottom: 10px;
        }

        .toggle-content li a {
            font-size: 13px;
            color: #444;
            cursor: pointer;
            text-decoration: none;
        }

        .toggle-content li a:hover {
            color: #000;
            font-weight: 500;
        }

        /* COLORS */
        .toggle-content.colors {
            display: flex;
            gap: 10px;
        }

        .toggle-content.colors li {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* BUTTONS */
        .apply-btn {
            width: 100%;
            background: #ff4f7a;
            border: none;
            padding: 12px;
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            margin-top: 20px;
        }

        .reset-btn {
            width: 100%;
            background: #3b82f6;
            border: none;
            padding: 12px;
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            margin-top: 10px;
        }


        /* ================= RESPONSIVE ================= */
        @media (max-width: 992px) {
            .filter-panel {
                position: relative;
                top: unset;
            }
        }

        @media (max-width: 576px) {
            .search-results > div:first-child {
                flex-direction: column;
                align-items: flex-start;
            }
        }


        .search-results h2 {
            margin-bottom: 20px;
        }


        @media (max-width: 992px) {

            .search-page {
                flex-direction: column;
            }

            .filter-panel {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .filter-btn {
                grid-column: span 2;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {

            .search-page {
                padding: 100px 5% 30px;
            }

            .filter-panel {
                grid-template-columns: 1fr;
            }

            .filter-btn {
                grid-column: span 1;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }

        /* -------------------- ADVANCED SEARCH PAGE -------------------- */

    </style>

</head>

<script>
    document.querySelectorAll(".toggle-header").forEach(header => {
