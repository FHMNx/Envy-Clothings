<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Envy Clothings - Wishlist</title>

    <link rel="stylesheet" href="assets/css/manage-product.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="assets/images/logo/envy.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        .wishlist-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 0.5fr;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
        }

        .wishlist-item {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 0.5fr;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #ddd8d8;
        }

        .wishlist-item .product {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .wishlist-item img {
            width: 90px;
            height: 110px;
            object-fit: cover;
            background: #f2f2f2;
        }

        .item-detail p {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .add-cart-btn {
            padding: 10px 18px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s ease;
            text-align: center;
        }

        .add-cart-btn:hover {
            background: #4c1e1e;
        }

        .remove {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #777;
        }

        .remove:hover {
            color: red;
        }

        /* ---- Responsive ---- */
        @media (max-width: 768px) {

            .wishlist-header {
                display: none;
            }

            .wishlist-item {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .wishlist-item span,
            .wishlist-item button {
                width: 100%;
            }

            .add-cart-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header class="site-header">
    <header-content></header-content>
</header>

    <!-- HEADER -->
    <div class="wishlist-header">

        <span>Action</span>
        <span>Remove</span>
    </div>
