<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="robots" content="noindex, follow"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <title>404 | Envy-Clothings</title>

    <style>

        }

<body class="flex flex-col items-center justify-center min-h-screen bg-white px-4 text-center">

<img src="assets/images/logo/envy.png"

<div class="flex flex-col md:flex-row gap-4 mt-4">
    <a href="#"

        Go Home
    </a>

    <a href="#"
       class="border-2 border-[#5C4742] text-[#5C4742] hover:bg-[#5C4742] hover:text-white font-semibold py-3 px-10 rounded-xl transition-all shadow-md hover:shadow-lg">
        Browse Shop
    </a>
</div>

<div class="mt-6 text-sm text-gray-500">

</div>

</html>
