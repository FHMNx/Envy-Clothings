                <!-- ======= Menu collapse Icon ===== -->

                    <a href="#" class="pc-head-link ms-0" id="sidebar-hide">
                        <i class="bi bi-list"></i>

                </li>
                <li class="pc-h-item pc-sidebar-popup">
                    <a href="#" class="pc-head-link ms-0" id="mobile-collapse">
                        <i class="bi bi-list"></i>
                    </a>
                </li>
                <li class="dropdown pc-h-item d-inline-flex d-md-none">

                            class="pc-head-link dropdown-toggle arrow-none m-0"

<div class="pc-container">
    <div class="pc-content">
        <!-- [ breadcrumb ] start -->
        <div class="page-header">
            <div class="page-block">
                <div class="row align-items-center">
                    <div class="col-md-12">
                        <div class="page-header-title">
                            <h5 class="m-b-10">Add Product</h5>
                        </div>
                        <ul class="breadcrumb">
                            <li class="breadcrumb-item">
                                <a href="#!">Products</a>
                            </li>
                            <li class="breadcrumb-item">
                                <a href="product-listing.html">Manage Products</a>
                            </li>
                            <li class="breadcrumb-item active" aria-current="page">
                                Add Product
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- [ breadcrumb ] end -->

        <!-- Add Product Form -->
        <div class="row">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h6 class="mb-3 text-center">Product Images</h6>

                        <div class="row g-3">
                            <!-- Image 1 -->
                            <div class="col-12">
                                <div class="text-center">
                                    <div class="product-image-preview mb-2">
                                        <img src="assets/images/logo/addProduct.png"
                                             id="previewImage1"
                                             class="img-fluid rounded"
                                             alt="Product Image 1">
                                    </div>
                                    <input type="file"
                                           id="img1"
                                           class="form-control form-control-sm"
                                           accept="image/*"
                                           onchange="previewMultiImage(event, 'previewImage1')">
                                </div>
                            </div>

                            <!-- Image 2 -->
                            <div class="col-12 col-sm-6">
                                <div class="text-center">
                                    <div class="product-image-preview mb-2">
                                        <img src="assets/images/logo/addProduct.png"
                                             id="previewImage2"
                                             class="img-fluid rounded"
                                             alt="Product Image 2">
                                    </div>
                                    <input type="file"
                                           id="img2"
                                           class="form-control form-control-sm"
                                           accept="image/*"
                                           onchange="previewMultiImage(event, 'previewImage2')">
                                </div>
                            </div>

                            <!-- Image 3 -->
                            <div class="col-12 col-sm-6">
                                <div class="text-center">
                                    <div class="product-image-preview mb-2">
                                        <img src="assets/images/logo/addProduct.png"
                                             id="previewImage3"
                                             class="img-fluid rounded"
                                             alt="Product Image 3">
                                    </div>
                                    <input type="file"
                                           id="img3"
                                           class="form-control form-control-sm"
                                           accept="image/*"
                                           onchange="previewMultiImage(event, 'previewImage3')">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <!-- Product Details -->
                <div class="card">
                    <div class="card-body">
                        <h6 class="mb-3">Product Information</h6>

                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Product Name</label>
                                    <input type="text" class="form-control" placeholder="Enter product name" id="title">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Brand</label>
                                    <select class="form-select" id="brandSelect" onchange="loadModels();">
                                        <option value="0">Select brand</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Model</label>
                                    <select class="form-select" id="modelSelect">
                                        <option value="0">Select Model</option>
                                    </select>
                                </div>


                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Colour</label>
                                    <select class="form-select" id="colorSelect">
                                        <option value="0">Select colour</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Size</label>
                                    <select class="form-select" id="sizeSelect">
                                        <option value="0">Select Size</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Category</label>
                                    <select class="form-select" id="categorySelect">
                                        <option value="0">Select Category</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Price</label>
                                    <input type="text" class="form-control" placeholder="Enter price" id="price">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Quantity</label>
                                    <input type="number" class="form-control" placeholder="Enter quantity" id="quantity" min="1">
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" id="description" rows="4" placeholder="Product description"></textarea>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="text-end">
                                <button type="reset" class="btn btn-light me-2">
                                    Reset
                                </button>
                                <button type="button" class="btn btn-primary" onclick="saveProduct();">
                                    Add Product
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/plugins/popper.min.js"></script>

<script src="assets/js/plugins/feather.min.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/adminLogout.js"></script>
<script src="assets/js/add-product.js"></script>

<script>
    function previewMultiImage(event, imageId) {
        const image = document.getElementById(imageId);
        image.src = URL.createObjectURL(event.target.files[0]);
    }
</script>



</body>
</html>
