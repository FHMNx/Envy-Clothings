<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="robots" content="noindex, follow"/>
    <meta name="description" content=""/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <title>Envy-Clothings Online</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        input[type="text"]::-webkit-outer-spin-button,
        input[type="text"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="text"] {
            appearance: textfield;
        }

        .otp-input:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(92, 71, 66, 0.4);
            border-color: #5C4742;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen text-center px-4">

<img src="assets/images/logo/envy.png" alt="Envy Clothing Logo" class="w-24 mb-6">

<h2 class="text-2xl md:text-3xl font-bold text-[#5C4742] mb-2">
    Enter Your Verification Code
</h2>

<p class="text-gray-600 text-sm md:text-base mb-8 max-w-md">
    We’ve sent you a one-time password to your registered email address.
</p>

<form class="flex justify-center gap-3 mb-8" id="verificationCode">
    <input type="text" maxlength="1"
           class="otp-input w-12 h-12 md:w-14 md:h-14 border-2 border-gray-300 rounded-xl text-center text-xl font-semibold text-[#5C4742] focus:border-[#5C4742] transition-all">
    <input type="text" maxlength="1"
           class="otp-input w-12 h-12 md:w-14 md:h-14 border-2 border-gray-300 rounded-xl text-center text-xl font-semibold text-[#5C4742] focus:border-[#5C4742] transition-all">
    <input type="text" maxlength="1"
           class="otp-input w-12 h-12 md:w-14 md:h-14 border-2 border-gray-300 rounded-xl text-center text-xl font-semibold text-[#5C4742] focus:border-[#5C4742] transition-all">
    <input type="text" maxlength="1"
           class="otp-input w-12 h-12 md:w-14 md:h-14 border-2 border-gray-300 rounded-xl text-center text-xl font-semibold text-[#5C4742] focus:border-[#5C4742] transition-all">
    <input type="text" maxlength="1"
           class="otp-input w-12 h-12 md:w-14 md:h-14 border-2 border-gray-300 rounded-xl text-center text-xl font-semibold text-[#5C4742] focus:border-[#5C4742] transition-all">
    <input type="text" maxlength="1"
           class="otp-input w-12 h-12 md:w-14 md:h-14 border-2 border-gray-300 rounded-xl text-center text-xl font-semibold text-[#5C4742] focus:border-[#5C4742] transition-all">
</form>

<button class="bg-[#5C4742] hover:bg-[#483531] text-white font-semibold py-3 px-10 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg" onclick="verifyAccount();">
    Verify Account
</button>

<div class="mt-6 text-sm text-gray-600">
    Didn’t receive the code?
    <a href="#" class="text-[#5C4742] font-semibold hover:underline">Resend</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/verify-account.js"></script>

<script>
    const inputs = document.querySelectorAll("#verificationCode input");

    inputs.forEach((input, index) => {

        input.addEventListener("input", () => {
            if (input.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
                inputs[index - 1].focus();
            }
        });

    });
</script>



</body>
</html>
