<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="robots" content="noindex, follow"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <title>Reset Password | Envy Clothings</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(92, 71, 66, 0.4);
            border-color: #5C4742;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen text-center px-4">

<img src="assets/images/logo/envy.png" alt="Envy Clothing Logo" class="w-24 mb-6">

<h2 class="text-2xl md:text-3xl font-bold text-[#5C4742] mb-2">
    Reset Your Password
</h2>

<p class="text-gray-600 text-sm md:text-base mb-8 max-w-md">
    Please enter a new password for your account. Make sure it’s strong and secure.
</p>

<!-- Reset Password Form -->
<form class="w-full max-w-sm space-y-4">

    <input type="password"
           id="newPassword"
           placeholder="New Password"
           class="w-full h-12 border-2 border-gray-300 rounded-xl px-4 text-[#5C4742] font-medium transition-all">

    <input type="password"
           id="confirmPassword"
           placeholder="Confirm New Password"
           class="w-full h-12 border-2 border-gray-300 rounded-xl px-4 text-[#5C4742] font-medium transition-all">

</form>

<button onclick="resetPassword();"
        class="mt-6 bg-[#5C4742] hover:bg-[#483531] text-white font-semibold py-3 px-10 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg">
    Reset Password
</button>

<div class="mt-6 text-sm text-gray-600">
    Remember your password?
    <a href="sign-in.html" class="text-[#5C4742] font-semibold hover:underline">
        Sign In
    </a>
</div>

<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/register.js"></script>

</body>
</html>
